<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leo 的 DSH 插件</title>
<style>body{font:16px/1.8 system-ui,sans-serif;color:#253047;background:#f7f8fc;margin:0}main{max-width:780px;margin:10vh auto;padding:32px}article{background:white;border:1px solid #e3e6ef;border-radius:20px;padding:28px}img{width:48px}h1{font-size:30px}h2{margin-bottom:4px}a{color:#5144ad}code{display:block;overflow-wrap:anywhere;background:#f0eef9;padding:14px;border-radius:8px}button{margin-top:12px;padding:8px 16px;border:0;border-radius:8px;background:#5144ad;color:white;cursor:pointer}small{color:#657085}</style>
<main><h1>Leo 的 DSH 插件</h1><p>让 AI 对话更顺手。开源、免费安装，在你的电脑上运行。</p>
<article><img src="icon.svg" alt=""><h2>对话助手</h2><p>简短的下一句预测、笔误纠正、深度改写，以及通俗摘要。</p><p>在 DSH 中打开「插件 → 发现 → 添加索引源」，粘贴：</p><code id="url"></code><button id="copy">复制索引地址</button><p><a href="index.json">查看插件目录</a> · <a href="https://github.com/tula-liuxin/dsh-conversation-companion">源码与使用说明</a></p><small>v0.5.0 · MIT · 适配 DSH 0.2.1-rc.3<br>AI 功能使用你自己的模型配置，会消耗模型用量。建议由你确认后才会采用到输入框。</small></article></main>
<script>const url=new URL('index.json',location.href).href;document.getElementById('url').textContent=url;document.getElementById('copy').onclick=async function(){try{await navigator.clipboard.writeText(url);this.textContent='已复制'}catch{this.textContent='请手动复制上方地址'}};</script></html>
